<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DinoTV · Promo de estreno</title><link rel="stylesheet" href="css/wiiu.css">
<style>
.promo{position:absolute;inset:0;background:linear-gradient(135deg,#0D47A1,#0288D1 45%,#00C2A8)}
.clips{position:absolute;right:-40px;top:110px;display:flex;gap:16px;transform:rotate(-6deg)}
.clip{width:300px;height:190px;border-radius:22px;border:6px solid #fff;position:relative;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.clip:nth-child(2){transform:translateY(60px)} .clip:nth-child(3){transform:translateY(-20px)}
.slash{position:absolute;left:-60px;bottom:120px;width:900px;height:210px;background:#FFCA28;transform:skewY(-6deg) rotate(-2deg);box-shadow:0 18px 40px rgba(0,0,0,.3)}
.slash2{position:absolute;left:-60px;bottom:96px;width:760px;height:40px;background:#FF6F61;transform:skewY(-6deg) rotate(-2deg)}
.txt{position:absolute;left:70px;bottom:150px;transform:rotate(-4deg);color:#1a1a1a}
.txt .kick{display:inline-block;background:#E53935;color:#fff;font-weight:900;font-size:26px;letter-spacing:.12em;padding:6px 18px;border-radius:10px;margin-bottom:8px}
.txt h1{font-size:76px;font-weight:900;line-height:.95;letter-spacing:-1px;text-transform:uppercase}
.txt .when{font-size:40px;font-weight:900;color:#0D47A1}
.count{position:absolute;right:70px;bottom:70px;width:170px;height:170px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 0 0 10px rgba(255,255,255,.35),0 20px 40px rgba(0,0,0,.3);transform:rotate(8deg)}
.count b{font-size:64px;font-weight:900;color:#E53935;line-height:1} .count span{font-weight:900;font-size:16px;color:var(--ink)}
.stars span{position:absolute;color:#fff;opacity:.8;font-size:28px}
</style></head><body>
<div class="stage-tv">
  <div class="promo"></div>
  <div class="stars"><span style="left:80px;top:60px">✦</span><span style="left:420px;top:120px">✧</span><span style="left:260px;top:240px;font-size:18px">✦</span></div>
  <div class="clips"><div class="clip"><div class="art art-isla">🏝️</div></div><div class="clip"><div class="art art-mecha">🦍</div></div><div class="clip"><div class="art art-isla" style="filter:hue-rotate(40deg)">🦖</div></div></div>
  <div class="slash"></div><div class="slash2"></div>
  <div class="txt"><span class="kick">ESTRENO</span><h1>La Isla de<br>los Gigantes</h1><div class="when">ESTE SÁBADO · 8 PM</div></div>
  <div class="count"><div><b>5</b><span>DÍAS</span></div></div>
  <div class="dog"><div class="logo-dino">🦖</div>DinoTV</div>
  <div style="position:absolute;left:70px;top:40px;color:#fff;font-weight:900;font-size:18px;opacity:.85">Solo en DinoTV · Película · +7</div>
</div></body></html>
